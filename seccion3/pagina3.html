
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌹 Rosas Azules para Ti</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: #000;
            /* ✅ Quita overflow: hidden para poder desplazarse */
            overflow-x: hidden; /* Solo oculta el desplazamiento horizontal */
            overflow-y: auto;   /* ✅ Permite bajar/desplazarse verticalmente */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start; /* ✅ Cambia de center a flex-start */
            color: #a0d8ff;
            font-family: 'Arial', sans-serif;
            padding: 40px 20px 60px; /* ✅ Más espacio arriba y abajo */
        }
        h1 {
            font-size: 2rem;
            color: #4fc3f7;
            text-shadow: 0 0 20px #4fc3f7, 0 0 40px #0288d1;
            margin-bottom: 20px;
            text-align: center;
            z-index: 10;
        }
        .subtitulo {
            color: #81d4fa;
            font-size: 1.1rem;
            margin-bottom: 40px;
            text-shadow: 0 0 10px #4fc3f7;
            z-index: 10;
            text-align: center;
        }
        .contenedor-circulos {
            position: relative;
            width: 400px;
            height: 400px;
            z-index: 5;
            flex-shrink: 0;
            margin: 20px 0; /* ✅ Espacio alrededor */
        }
        .circulo {
            position: absolute;
            border-radius: 50%;
            border: 1px solid rgba(79, 195, 247, 0.2);
            top: 50%;
            left: 50%;
            transform-origin: center center;
            animation: girar 20s linear infinite;
        }
        .circulo:nth-child(1) { width: 180px; height: 180px; margin: -90px 0 0 -90px; animation-duration: 12s; }
        .circulo:nth-child(2) { width: 280px; height: 280px; margin: -140px 0 0 -140px; animation-duration: 18s; animation-direction: reverse; }
        .circulo:nth-child(3) { width: 380px; height: 380px; margin: -190px 0 0 -190px; animation-duration: 25s; }
        .rosa-img {
            position: absolute;
            width: 45px;
            height: 45px;
            object-fit: contain;
            filter: drop-shadow(0 0 8px #4fc3f7) drop-shadow(0 0 16px #0288d1);
            animation: flotar 3s ease-in-out infinite alternate;
        }
        .circulo:nth-child(1) .rosa-img { top: -10px; left: 50%; transform: translateX(-50%); }
        .circulo:nth-child(2) .rosa-img { top: -10px; left: 50%; transform: translateX(-50%); width: 55px; height: 55px; }
        .circulo:nth-child(3) .rosa-img { top: -10px; left: 50%; transform: translateX(-50%); width: 65px; height: 65px; }
        .rosa-central {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 120px;
            height: 120px;
            object-fit: contain;
            filter: drop-shadow(0 0 15px #4fc3f7) drop-shadow(0 0 30px #0288d1);
            animation: latir 2s ease-in-out infinite;
            z-index: 10;
        }
        .mensaje {
            margin-top: 20px;
            font-size: 1.2rem;
            color: #b3e5fc;
            text-align: center;
            text-shadow: 0 0 12px #4fc3f7;
            max-width: 500px;
            z-index: 10;
        }
        .botones {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 40px; /* ✅ Más espacio arriba de los botones */
            z-index: 10;
            position: relative; /* ✅ Asegura que queden visibles */
        }
        .volver {
            padding: 12px 30px;
            background: transparent;
            border: 2px solid #4fc3f7;
            color: #4fc3f7;
            border-radius: 30px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            transition: all 0.4s ease;
            text-decoration: none;
            text-align: center;
            width: 220px;
        }
        .volver:hover {
            background: #4fc3f7;
            color: #000;
            box-shadow: 0 0 20px #4fc3f7, 0 0 40px #0288d1;
            transform: scale(1.05);
        }
        @keyframes girar {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        @keyframes flotar {
            from { transform: translateY(-5px); }
            to { transform: translateY(5px); }
        }
        @keyframes latir {
            0% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.1); }
            100% { transform: translate(-50%, -50%) scale(1); }
        }
        @keyframes parpadear {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }
        .auto {
            position: fixed;
            height: 40px;
            object-fit: contain;
            z-index: 3;
            pointer-events: none;
            filter: drop-shadow(0 0 6px rgba(255,255,255,0.5));
        }
        .auto-izq-der {
            animation: cruzar-izq 15s linear infinite;
        }
        .auto-der-izq {
            animation: cruzar-der 15s linear infinite;
        }
        @keyframes cruzar-izq {
            from { transform: translateX(-100px); }
            to { transform: translateX(calc(100vw + 100px)); }
        }
        @keyframes cruzar-der {
            from { transform: translateX(calc(100vw + 100px)); }
            to { transform: translateX(-100px); }
        }
        .estrellas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }
        .estrella {
            position: absolute;
            background: #fff;
            border-radius: 50%;
            animation: parpadear 3s ease-in-out infinite;
        }
        @media(max-width: 500px) {
            body {
                padding: 30px 15px 50px; /* ✅ Ajuste de espaciado en móvil */
                justify-content: flex-start;
            }
            .contenedor-circulos { width: 300px; height: 300px; }
            .circulo:nth-child(1) { width: 140px; height: 140px; margin: -70px 0 0 -70px; }
            .circulo:nth-child(2) { width: 210px; height: 210px; margin: -105px 0 0 -105px; }
            .circulo:nth-child(3) { width: 290px; height: 290px; margin: -145px 0 0 -145px; }
            .rosa-central { width: 90px; height: 90px; }
            h1 { font-size: 1.5rem; }
            .auto { height: 30px; }
            .volver { width: 200px; padding: 10px 20px; }
        }
    </style>
</head>
<body>
    <div class="estrellas" id="estrellas"></div>

    <img src="../public/auto-Photoroom.png" class="auto auto-izq-der" style="top: 20%; animation-delay: 0s;" alt="Auto">
    <img src="../public/Día Hot Wheels-Photoroom.png" class="auto auto-der-izq" style="top: 35%; animation-delay: 3s;" alt="Auto">
    <img src="../public/Día Hot Wheels (1)-Photoroom.png" class="auto auto-izq-der" style="top: 55%; animation-delay: 6s;" alt="Auto">
    <img src="../public/Día Hot Wheels (2)-Photoroom.png" class="auto auto-der-izq" style="top: 70%; animation-delay: 9s;" alt="Auto">
    <img src="../public/Día Hot Wheels (3)-Photoroom.png" class="auto auto-izq-der" style="top: 85%; animation-delay: 12s;" alt="Auto">

    <h1>🌹 Para Ti, mi persona especial 🌹</h1>
    <p class="subtitulo">Tan única y hermosa como estas rosas azules 💙</p>

    <div class="contenedor-circulos">
        <div class="circulo">
            <img src="../public/emojis.com rosa-azul.png" class="rosa-img" alt="Rosa azul">
        </div>
        <div class="circulo">
            <img src="../public/emojis.com rosa-azul-com-espinhos-e-uma-coroa.png" class="rosa-img" alt="Rosa azul">
            <img src="../public/emojis.com blue-rose-and-wings.png" class="rosa-img" style="top:auto;bottom:-10px;left:50%;transform:translateX(-50%)" alt="Rosa azul">
        </div>
        <div class="circulo">
            <img src="../public/emojis.com blue-rose-with-wings.png" class="rosa-img" alt="Rosa azul">
            <img src="../public/emojis.com single-white-rose-with-a-stem.png" class="rosa-img" style="top:auto;bottom:-10px;left:50%;transform:translateX(-50%)" alt="Rosa azul">
            <img src="../public/emojis.com single-deep-blue-iris,-straight-stem.png" class="rosa-img" style="right:-10px;left:auto;top:50%;transform:translateY(-50%)" alt="Rosa azul">
            <img src="../public/emojis.com black-goku-rosé.png" class="rosa-img" style="left:-10px;top:50%;transform:translateY(-50%)" alt="Rosa azul">
        </div>
        <img src="../public/emojis.com dark-blue-rose-with-a-black-stem.png" class="rosa-central" alt="Rosa azul principal">
    </div>

    <p class="mensaje">
        Las rosas azules son únicas, raras y hermosas...<br>
        Igual que tú.<br><br>
        Nadie brilla como tú, nadie ilumina mi mundo como tú lo haces.<br>
        Eres mi flor más preciosa, hoy y siempre. 💙🌹
    </p>

    <div class="botones">
        <a href="../seccion2/pagina2.html" class="volver">← Volver a la carta</a>
        <a href="../index.html" class="volver">← Volver al inicio</a>
    </div>

    <script>
        const contenedor = document.getElementById('estrellas');
        for(let i = 0; i < 100; i++) {
            const estrella = document.createElement('div');
            estrella.classList.add('estrella');
            estrella.style.left = Math.random() * 100 + '%';
            estrella.style.top = Math.random() * 100 + '%';
            estrella.style.width = (Math.random() * 2 + 1) + 'px';
            estrella.style.height = estrella.style.width;
            estrella.style.animationDelay = Math.random() * 3 + 's';
            contenedor.appendChild(estrella);
        }
    </script>
</body>
</html>
